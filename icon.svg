<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Tessera app icon source. Regenerate platform icons with: npx tauri icon app-icon.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0b1f4d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="56" y="56" width="912" height="912" rx="208" fill="url(#bg)"/>
  <rect x="56" y="56" width="912" height="912" rx="208" fill="url(#sheen)"/>

  <!-- angle brackets -->
  <g fill="none" stroke="#ffffff" stroke-width="88" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="322,316 176,512 322,708"/>
    <polyline points="702,316 848,512 702,708"/>
  </g>

  <!-- 2×2 mosaic tile (the "tessera"), set on the diagonal -->
  <g transform="rotate(45 512 512)">
    <rect x="417" y="417" width="86" height="86" rx="16" fill="#fbbf24"/>
    <rect x="521" y="417" width="86" height="86" rx="16" fill="#2dd4bf"/>
    <rect x="417" y="521" width="86" height="86" rx="16" fill="#f472b6"/>
    <rect x="521" y="521" width="86" height="86" rx="16" fill="#ffffff"/>
  </g>
</svg>
